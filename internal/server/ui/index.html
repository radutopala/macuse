<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>macuse</title>
<style>
:root {
  --bg: #f6f6f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
  --line: #e2e2e6; --accent: #0a66d8; --accent-text: #ffffff;
  --warn-bg: #fff4e0; --warn-text: #8a5300; --danger: #c4314b; --ok: #1f8a4c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1e20; --card: #2a2a2d; --text: #f2f2f4; --muted: #a1a1a8;
    --line: #3a3a3e; --accent: #3d8bfd; --accent-text: #ffffff;
    --warn-bg: #3b2e14; --warn-text: #f1c37a; --danger: #ff6b81; --ok: #4cc27f;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  -webkit-user-select: none; user-select: none; }
header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
header h1 { font-size: 14px; margin: 0; flex: 1; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.paused { background: var(--muted); }
main { padding: 0 10px 10px; }
section { margin-top: 10px; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
  margin: 0 4px 6px; font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.card + .card { margin-top: 6px; }
.request { border-color: var(--accent); }
.title { font-weight: 600; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.row { display: flex; align-items: center; gap: 8px; }
.row .grow { flex: 1; min-width: 0; }
.buttons { display: flex; gap: 6px; margin-top: 8px; }
button { font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--card);
  color: var(--text); padding: 4px 10px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.link { border: none; background: none; color: var(--accent); padding: 2px 4px; }
button.danger { color: var(--danger); }
.buttons button { flex: 1; }
.empty { color: var(--muted); padding: 2px 4px; }
.warn { background: var(--warn-bg); color: var(--warn-text); border-color: transparent; }
button:disabled { opacity: .6; cursor: default; }
[hidden] { display: none !important; }
#notice, #perms .card, #update .card { margin-bottom: 8px; }
footer { display: flex; align-items: center; gap: 8px; padding: 8px 14px 12px; color: var(--muted); font-size: 12px; }
footer label { flex: 1; display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1>macuse</h1>
  <button id="pause"></button>
</header>
<main>
  <div id="notice" class="card warn" hidden></div>
  <div id="perms"></div>
  <div id="update"></div>
  <section>
    <h2>Requests</h2>
    <div id="pending"></div>
  </section>
  <section>
    <h2>Activity</h2>
    <div id="activity"></div>
  </section>
  <section>
    <h2>Always allowed or denied</h2>
    <div id="approvals"></div>
  </section>
</main>
<footer>
  <label><input type="checkbox" id="login"> Open at login</label>
  <button class="link" id="cli" hidden>Install CLI</button>
  <span id="version"></span>
  <button class="link" id="check">Check for updates</button>
  <button class="link" id="quit">Quit</button>
</footer>
<script>
"use strict";
const key = new URLSearchParams(location.search).get("key") || "";
let state = null;

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { "X-Macuse-UI-Key": key, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error.message; } catch (e) { /* keep statusText */ }
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}

// el builds an element; strings become text nodes, never markup, since
// client and app names come from agents.
function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "onclick") n.addEventListener("click", v);
    else n.setAttribute(k, v);
  }
  for (const c of children) n.append(c);
  return n;
}

function ago(iso) {
  const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  return Math.round(s / 3600) + "h ago";
}

// say shows a message for a while. The web view has no UI delegate, so
// alert() would show nothing.
let noticeTimer = 0;
function say(msg) {
  const n = document.getElementById("notice");
  n.textContent = msg;
  n.hidden = false;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { n.hidden = true; }, 6000);
}

function act(p) { p.then(refresh).catch(err => say(err.message)); }

function render() {
  const st = state;
  document.getElementById("dot").className = "dot" + (st.paused ? " paused" : "");
  const pause = document.getElementById("pause");
  pause.textContent = st.paused ? "Resume" : "Pause all";
  pause.className = st.paused ? "primary" : "";
  document.getElementById("version").textContent = st.version;
  document.getElementById("login").checked = st.login_item;
  document.getElementById("cli").hidden = st.cli !== "missing";

  const up = st.update;
  fill("update", up, () => {
    if (!up || !up.available) return [];
    const install = el("button", { class: "primary", onclick: () => {
      install.disabled = true;
      install.textContent = "Installing…";
      api("POST", "/ui/api/update/install").catch(err => { say(err.message); delete shown.update; refresh(); });
    } }, up.installing ? "Installing…" : "Install and restart");
    install.disabled = !!up.installing;
    return [el("div", { class: "card request row" },
      el("div", { class: "grow" },
        el("div", { class: "title" }, "macuse " + up.latest + " is available"),
        el("div", { class: "sub" }, up.error || "You have " + up.current + ".")),
      install)];
  });

  const p = st.permissions;
  fill("perms", p, () => {
    if (!p || (p.accessibility && p.screen_recording)) return [];
    const missing = [!p.accessibility && "Accessibility", !p.screen_recording && "Screen Recording"].filter(Boolean);
    return [el("div", { class: "card warn row" },
      el("div", { class: "grow" }, "macuse needs " + missing.join(" and ") + " access."),
      el("button", { onclick: () => act(api("POST", "/ui/api/permissions")) }, "Grant"))];
  });

  fill("pending", st.pending, () => {
    if (!st.pending.length) return [el("div", { class: "empty" }, "No requests waiting.")];
    return st.pending.map(r => {
      const answer = a => () => act(api("POST", "/ui/api/answer", { id: r.id, answer: a }));
      return el("div", { class: "card request" },
        el("div", { class: "title" }, r.client + " wants to control " + r.app.name),
        el("div", { class: "sub" }, r.app.bundle_id + (r.app.team_id ? " · team " + r.app.team_id : "") +
          " · " + r.action + " · session " + r.session),
        el("div", { class: "buttons" },
          el("button", { onclick: answer("deny") }, "Deny"),
          el("button", { onclick: answer("session") }, "This session"),
          el("button", { class: "primary", onclick: answer("always") }, "Always")));
    });
  });

  const activity = st.activity.map(a => ({ ...a, ago: ago(a.at) }));
  fill("activity", activity, () => {
    if (!activity.length) return [el("div", { class: "empty" }, "No agent has used the Mac yet.")];
    return activity.map(a => {
      const row = el("div", { class: "card row" },
        el("div", { class: "grow" },
          el("div", { class: "title" }, a.client + " · " + a.app),
          el("div", { class: "sub" }, a.action + " · " + a.ago + (a.stopped ? " · stopped" : ""))));
      if (!a.stopped) {
        row.append(el("button", { class: "danger",
          onclick: () => act(api("POST", "/ui/api/stop", { session: a.session })) }, "Stop"));
      }
      return row;
    });
  });

  fill("approvals", st.approvals, () => {
    if (!st.approvals.length) return [el("div", { class: "empty" }, "None yet.")];
    return st.approvals.map(s => {
      const q = "?bundle_id=" + encodeURIComponent(s.bundle_id) + "&team_id=" + encodeURIComponent(s.team_id);
      return el("div", { class: "card row" },
        el("div", { class: "grow" },
          el("div", { class: "title" }, (s.name || s.bundle_id) + " · " + (s.decision === "allow" ? "allowed" : "denied")),
          el("div", { class: "sub" }, s.bundle_id + (s.team_id ? " · team " + s.team_id : ""))),
        el("button", { class: "link", onclick: () => act(api("DELETE", "/ui/api/approvals" + q)) }, "Forget"));
    });
  });
}

// fill rebuilds a list only when what it shows changed, so the refresh
// never swaps a button out between the press and the release of a click.
const shown = {};
function fill(id, data, build) {
  const sig = String(JSON.stringify(data));
  if (shown[id] === sig) return;
  shown[id] = sig;
  document.getElementById(id).replaceChildren(...build());
}

async function refresh() {
  try {
    state = await api("GET", "/ui/api/state");
    render();
  } catch (e) { /* the server is restarting; try again on the next tick */ }
}

document.getElementById("pause").addEventListener("click",
  () => act(api("POST", "/ui/api/pause", { paused: !state.paused })));
document.getElementById("login").addEventListener("change",
  e => act(api("POST", "/ui/api/login-item", { enabled: e.target.checked })));
document.getElementById("cli").addEventListener("click", () => act(api("POST", "/ui/api/cli")));
const check = document.getElementById("check");
check.addEventListener("click", () => {
  check.disabled = true;
  check.textContent = "Checking…";
  api("POST", "/ui/api/update/check")
    .then(up => {
      if (up.error) say(up.error);
      else if (!up.available) say("macuse " + up.current + " is the latest version.");
      refresh();
    })
    .catch(err => say(err.message))
    .finally(() => { check.disabled = false; check.textContent = "Check for updates"; });
});
document.getElementById("quit").addEventListener("click", () => api("POST", "/ui/api/quit").catch(() => {}));

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
